# =============================================================================
# Katarina's Nutrition Tracker — Local Development Stack
#
# Usage:
#   (run from this docker/ directory)
#   docker compose up           → starts both frontend and backend
#   docker compose up backend   → backend only
#   docker compose logs -f      → follow logs
#   docker compose down         → stop everything
#
# Web app: http://localhost:5173
# API:     http://localhost:3001
# Health:   http://localhost:3001/health
# =============================================================================

services:

  # ── Backend: Node.js + TypeScript + Express + SQLite ──────────────────────
  backend:
    build:
      context: ..                 # repo root: the image needs shared/ too
      dockerfile: api/Dockerfile
    container_name: nutrition-api
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: development
    volumes:
      # Persist SQLite database file outside the container
      - nutrition-db:/app/data   # DB_PATH in the image points here
      # Hot reload: mount source for ts-node-dev
      - ../api/src:/app/api/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend: React + TypeScript + Vite ───────────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: nutrition-app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ""   # Empty = uses Vite proxy to backend
      API_PROXY_TARGET: http://backend:3001
    depends_on:
      - backend
    volumes:
      - ../web/src:/app/web/src  # Hot reload
    restart: unless-stopped

volumes:
  nutrition-db:
    driver: local
