name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # One install for the whole workspace. The root postinstall builds
      # shared/, which api/ and web/ import.
      - run: npm ci

      - name: shared — typecheck and test
        run: npm run typecheck -w @nutrition/shared && npm test -w @nutrition/shared

      - name: api — build and test
        run: npm run build -w @nutrition/api && npm test -w @nutrition/api

      - name: web — build and test
        run: npm run build -w @nutrition/web && npm test -w @nutrition/web
